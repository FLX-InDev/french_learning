<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- 故事封面：小熊 — 棕色小熊抱蜂蜜罐 + 森林背景 -->
  <rect width="160" height="90" fill="#F0F4FF"/>
  <!-- 森林树 -->
  <rect x="12" y="30" width="8" height="52" rx="2" fill="#6B8E23"/>
  <circle cx="16" cy="24" r="14" fill="#A8E6CF"/>
  <rect x="140" y="26" width="8" height="56" rx="2" fill="#6B8E23"/>
  <circle cx="144" cy="20" r="14" fill="#88D8B0"/>
  <rect x="24" y="40" width="6" height="42" rx="2" fill="#4A7028"/>
  <circle cx="27" cy="34" r="12" fill="#A8E6CF" opacity="0.7"/>
  <!-- 地面 -->
  <ellipse cx="80" cy="90" rx="82" ry="14" fill="#C8E6C9"/>
  <!-- 小熊身体 -->
  <ellipse cx="72" cy="64" rx="24" ry="20" fill="#C8A878"/>
  <!-- 头 -->
  <circle cx="72" cy="42" r="16" fill="#C8A878"/>
  <!-- 耳朵 -->
  <circle cx="58" cy="32" r="7" fill="#C8A878"/>
  <circle cx="58" cy="32" r="4" fill="#E8C898"/>
  <circle cx="86" cy="32" r="7" fill="#C8A878"/>
  <circle cx="86" cy="32" r="4" fill="#E8C898"/>
  <!-- 眼睛 -->
  <circle cx="66" cy="40" r="2.5" fill="#4A3728"/>
  <circle cx="78" cy="40" r="2.5" fill="#4A3728"/>
  <!-- 鼻子 -->
  <ellipse cx="72" cy="47" rx="4" ry="3" fill="#4A3728"/>
  <!-- 嘴 -->
  <path d="M70 50 Q72 53 74 50" stroke="#4A3728" stroke-width="1.2" fill="none"/>
  <!-- 蜂蜜罐 -->
  <rect x="88" y="60" width="14" height="18" rx="4" fill="#F5A623"/>
  <rect x="90" y="57" width="10" height="4" rx="2" fill="#C8960A"/>
  <rect x="91" y="64" width="8" height="4" rx="1" fill="#FFF8F0"/>
  <!-- 手臂抱着罐子 -->
  <path d="M92 56 Q100 52 102 60" stroke="#C8A878" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
