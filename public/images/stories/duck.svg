<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- 故事封面：小鸭 — 黄色小鸭在小河划船 + 荷叶 -->
  <rect width="160" height="90" fill="#88C6F0" opacity="0.4"/>
  <rect width="160" height="90" fill="#E8F4FC"/>
  <!-- 河水波纹 -->
  <path d="M0 68 Q20 64 40 68 Q60 72 80 68 Q100 64 120 68 Q140 72 160 68" stroke="#5BA3D4" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M0 76 Q20 72 40 76 Q60 80 80 76 Q100 72 120 76 Q140 80 160 76" stroke="#5BA3D4" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- 荷叶（左侧） -->
  <ellipse cx="28" cy="66" rx="18" ry="10" fill="#A8E6CF"/>
  <ellipse cx="28" cy="66" rx="14" ry="7" fill="#88D8B0" opacity="0.6"/>
  <line x1="28" y1="56" x2="28" y2="66" stroke="#5A9A7A" stroke-width="1.5"/>
  <!-- 荷花 -->
  <circle cx="32" cy="54" r="5" fill="#FF8B94" opacity="0.7"/>
  <circle cx="32" cy="54" r="2.5" fill="#F5A623"/>
  <!-- 小鸭子身体 -->
  <ellipse cx="88" cy="62" rx="22" ry="14" fill="#F5C842"/>
  <!-- 翅膀 -->
  <path d="M82 56 Q76 50 82 46 Q86 48 84 54 Z" fill="#E8A830"/>
  <!-- 头 -->
  <circle cx="104" cy="48" r="10" fill="#F5C842"/>
  <!-- 眼睛 -->
  <circle cx="107" cy="45" r="2" fill="#4A3728"/>
  <!-- 嘴巴（扁扁的） -->
  <ellipse cx="114" cy="50" rx="7" ry="3.5" fill="#F5A623"/>
  <line x1="107" y1="50" x2="121" y2="50" stroke="#E08820" stroke-width="1"/>
  <!-- 脖子 -->
  <path d="M104 56 Q100 58 96 60" stroke="#F5C842" stroke-width="3" fill="none"/>
  <!-- 小船（木桶状） -->
  <path d="M64 66 L72 82 L104 82 L112 66 Z" fill="#C8A878" opacity="0.9"/>
  <line x1="72" y1="72" x2="104" y2="72" stroke="#A88858" stroke-width="1.5"/>
  <line x1="76" y1="78" x2="100" y2="78" stroke="#A88858" stroke-width="1.5"/>
  <!-- 小桨 -->
  <line x1="66" y1="52" x2="58" y2="72" stroke="#A88858" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="57" cy="73" rx="3.5" ry="5" fill="#C8A878"/>
  <!-- 水花 -->
  <circle cx="56" cy="68" r="2" fill="#FFF8F0" opacity="0.7"/>
  <circle cx="116" cy="70" r="2.5" fill="#FFF8F0" opacity="0.6"/>
  <circle cx="124" cy="66" r="1.5" fill="#FFF8F0" opacity="0.5"/>
</svg>
