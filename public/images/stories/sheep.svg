<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- 故事封面：小羊 — 白色小羊站在花田背景 -->
  <rect width="160" height="90" fill="#FFF8F0"/>
  <!-- 天空 -->
  <rect width="160" height="55" fill="#C5E3F6" opacity="0.45"/>
  <!-- 太阳 -->
  <circle cx="138" cy="16" r="9" fill="#F5A623" opacity="0.65"/>
  <!-- 花田（地面） -->
  <ellipse cx="80" cy="82" rx="84" ry="18" fill="#A8E6CF"/>
  <!-- 花田小花 -->
  <circle cx="24" cy="76" r="4" fill="#FF8B94"/>
  <circle cx="32" cy="74" r="2" fill="#F5A623"/>
  <circle cx="48" cy="80" r="3.5" fill="#C3AED6"/>
  <circle cx="56" cy="76" r="2" fill="#FF8B94"/>
  <circle cx="108" cy="74" r="4" fill="#C3AED6"/>
  <circle cx="118" cy="78" r="2.5" fill="#FF8B94"/>
  <circle cx="132" cy="74" r="3.5" fill="#F5A623"/>
  <circle cx="142" cy="80" r="2" fill="#FF8B94"/>
  <!-- 小羊毛身（蓬松云状） -->
  <ellipse cx="72" cy="58" rx="24" ry="18" fill="#F5F2E8"/>
  <circle cx="52" cy="54" r="8" fill="#F5F2E8"/>
  <circle cx="64" cy="46" r="9" fill="#F5F2E8"/>
  <circle cx="80" cy="44" r="10" fill="#F5F2E8"/>
  <circle cx="92" cy="48" r="9" fill="#F5F2E8"/>
  <circle cx="100" cy="56" r="8" fill="#F5F2E8"/>
  <circle cx="44" cy="62" r="7" fill="#F5F2E8"/>
  <circle cx="104" cy="64" r="7" fill="#F5F2E8"/>
  <!-- 小羊头 -->
  <circle cx="102" cy="42" r="11" fill="#FFF8F0"/>
  <!-- 耳朵 -->
  <ellipse cx="94" cy="34" rx="5" ry="3.5" fill="#F5A623" opacity="0.7" transform="rotate(-25 94 34)"/>
  <ellipse cx="112" cy="34" rx="5" ry="3.5" fill="#F5A623" opacity="0.7" transform="rotate(25 112 34)"/>
  <!-- 卷毛（头顶） -->
  <circle cx="98" cy="31" r="4" fill="#F5F2E8"/>
  <circle cx="106" cy="30" r="4" fill="#F5F2E8"/>
  <!-- 眼睛 -->
  <circle cx="99" cy="40" r="2" fill="#4A3728"/>
  <circle cx="107" cy="40" r="2" fill="#4A3728"/>
  <!-- 鼻头 -->
  <ellipse cx="103" cy="46" rx="3" ry="2" fill="#FFB3BA" opacity="0.8"/>
  <!-- 腿 -->
  <rect x="60" y="74" width="6" height="10" rx="3" fill="#E8DCC8"/>
  <rect x="70" y="76" width="6" height="10" rx="3" fill="#E8DCC8"/>
  <rect x="80" y="76" width="6" height="10" rx="3" fill="#E8DCC8"/>
  <rect x="90" y="74" width="6" height="10" rx="3" fill="#E8DCC8"/>
</svg>
