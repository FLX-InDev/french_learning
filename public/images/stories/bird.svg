<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- 故事封面：小鸟 — 蓝色小鸟站树枝 + 天空 -->
  <rect width="160" height="90" fill="#88C6F0"/>
  <!-- 云朵 -->
  <ellipse cx="30" cy="18" rx="18" ry="8" fill="#FFF8F0" opacity="0.8"/>
  <ellipse cx="46" cy="16" rx="12" ry="6" fill="#FFF8F0" opacity="0.6"/>
  <ellipse cx="120" cy="28" rx="14" ry="7" fill="#FFF8F0" opacity="0.5"/>
  <!-- 树枝 -->
  <line x1="56" y1="62" x2="104" y2="56" stroke="#8B6914" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="59" x2="64" y2="48" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="57" x2="96" y2="48" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 叶子 -->
  <ellipse cx="63" cy="46" rx="6" ry="4" fill="#A8E6CF" transform="rotate(-30 63 46)"/>
  <ellipse cx="97" cy="46" rx="6" ry="4" fill="#88D8B0" transform="rotate(20 97 46)"/>
  <!-- 小鸟身体 -->
  <ellipse cx="80" cy="44" rx="14" ry="11" fill="#88C6F0"/>
  <!-- 头部 -->
  <circle cx="90" cy="36" r="9" fill="#88C6F0"/>
  <!-- 眼睛 -->
  <circle cx="93" cy="34" r="2" fill="#4A3728"/>
  <!-- 嘴巴 -->
  <polygon points="99,36 105,38 99,38" fill="#F5A623"/>
  <!-- 翅膀 -->
  <path d="M76 42 Q72 36 78 32 Q82 34 80 40 Z" fill="#5BA3D4"/>
  <!-- 尾巴 -->
  <polygon points="67,48 58,44 62,52" fill="#5BA3D4"/>
  <!-- 小星星 -->
  <circle cx="140" cy="12" r="2.5" fill="#F5A623" opacity="0.7"/>
  <circle cx="20" cy="50" r="2" fill="#FFF8F0" opacity="0.5"/>
</svg>
