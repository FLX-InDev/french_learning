<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 单词占位卡片 — 圆角方块 + 问号 + 狐狸吉祥物挥手 -->
  <!-- 背景 -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#FFF8F0" stroke="#C3AED6" stroke-width="2"/>
  <!-- 问号 -->
  <text x="32" y="36" font-family="sans-serif" font-size="28" font-weight="bold" fill="#C3AED6" text-anchor="middle">?</text>
  <!-- 狐狸尾巴（卷在右下角） -->
  <path d="M52 46 Q60 40 58 32 Q56 38 52 42 Z" fill="#F5A623" opacity="0.7"/>
  <!-- 狐狸头（角落探出） -->
  <circle cx="54" cy="52" r="8" fill="#F5A623"/>
  <!-- 耳朵 -->
  <polygon points="49,45 47,38 52,44" fill="#F5A623"/>
  <polygon points="59,45 61,38 56,44" fill="#F5A623"/>
  <polygon points="49.5,44 48,40 51,44" fill="#FFF8F0" opacity="0.4"/>
  <polygon points="58.5,44 60,40 57,44" fill="#FFF8F0" opacity="0.4"/>
  <!-- 眼睛 -->
  <circle cx="51.5" cy="50" r="1.2" fill="#4A3728"/>
  <circle cx="56.5" cy="50" r="1.2" fill="#4A3728"/>
  <!-- 鼻子 -->
  <ellipse cx="54" cy="54" rx="1.5" ry="1" fill="#4A3728"/>
  <!-- 小手挥动 -->
  <path d="M46 56 Q42 54 40 50" stroke="#F5A623" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="39" cy="49" r="2" fill="#F5A623"/>
</svg>
