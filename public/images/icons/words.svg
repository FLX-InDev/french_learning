<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- 学科图标：词汇学习 — 3 张彩卡 + 放大镜 -->
  <rect x="2" y="2" width="92" height="92" rx="18" fill="#FFF8F0"/>
  <!-- 卡片 1（左） -->
  <rect x="14" y="28" width="28" height="36" rx="6" fill="#A8E6CF"/>
  <circle cx="28" cy="44" r="8" fill="#FF8B94"/>
  <rect x="20" y="56" width="16" height="3" rx="1.5" fill="#FFF8F0"/>
  <!-- 卡片 2（中） -->
  <rect x="34" y="22" width="28" height="36" rx="6" fill="#88C6F0"/>
  <rect x="44" y="34" width="8" height="8" rx="2" fill="#FFF8F0"/>
  <rect x="40" y="46" width="16" height="3" rx="1.5" fill="#FFF8F0"/>
  <!-- 卡片 3（右） -->
  <rect x="54" y="28" width="28" height="36" rx="6" fill="#F5A623"/>
  <path d="M62 44 L68 36 L74 44 Z" fill="#FFF8F0"/>
  <rect x="60" y="56" width="16" height="3" rx="1.5" fill="#FFF8F0"/>
  <!-- 放大镜（右下） -->
  <circle cx="70" cy="70" r="12" fill="none" stroke="#9B59B6" stroke-width="3"/>
  <line x1="79" y1="79" x2="88" y2="88" stroke="#9B59B6" stroke-width="4" stroke-linecap="round"/>
  <!-- 问号 -->
  <text x="68" y="75" font-size="14" fill="#9B59B6" font-weight="bold" text-anchor="middle">?</text>
</svg>
